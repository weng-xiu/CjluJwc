# CjluJwc 教务管理系统一键编排（Q2 容器化）
# 使用：复制 .env.example 为 .env 并填写密钥后 `docker compose up -d --build`
# 注意：MySQL 首次启动自动导入 sql/备份 下全量库（Navicat 导出无 USE 语句，
#       依赖 MYSQL_DATABASE=yu-cjlujwc 作为默认库）；数据卷已存在时不会重复导入。

services:
  mysql:
    image: mysql:8.0
    container_name: yu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: yu-cjlujwc
      TZ: Asia/Shanghai
    command:
      - --lower-case-table-names=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首启自动建库（按文件名顺序执行 *.sql）
      - ./sql/备份/yu-cjlujwc_20260821.sql:/docker-entrypoint-initdb.d/01_full_backup.sql:ro
    ports:
      - "${DB_PORT_EXPOSE:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: yu-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}", "--appendonly", "true"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT_EXPOSE:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yu-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: yu-cjlujwc
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_USE_SSL: "false"
      DB_ALLOW_PUBLIC_KEY: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TOKEN_SECRET: ${TOKEN_SECRET:-}
      TZ: Asia/Shanghai
    volumes:
      - backend-logs:/app/logs
      - backend-upload:/app/uploadPath
    ports:
      - "${BACKEND_PORT_EXPOSE:-8080}:8080"

  frontend:
    build:
      context: ./yu-ui-vue3
      dockerfile: Dockerfile
    container_name: yu-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT_EXPOSE:-80}:80"

volumes:
  mysql-data:
  redis-data:
  backend-logs:
  backend-upload:
