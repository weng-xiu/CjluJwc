# CjluJwc 教务管理系统一键编排（Q2 容器化）
# 使用：复制 .env.example 为 .env 并填写密钥后 `docker compose up -d --build`
#
# V4.0 §7.3/C1 调整：不再挂载仓库内含真实数据的整库 dump。
#   MySQL 首启改为读取本机目录 ./docker/mysql-init/（已被 .gitignore 忽略），
#   该目录为空时只起一个空实例，由后端 Flyway（FLYWAY_ENABLED=true）建基线，
#   或按 docker/mysql-init/README.md 放置脱敏脚本。数据卷已存在时不会重复导入。

services:
  mysql:
    image: mysql:8.0
    container_name: yu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: yu-cjlujwc
      TZ: Asia/Shanghai
    command:
      - --lower-case-table-names=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首启自动导入：脚本由本机放置（脱敏 dump 或留空走 Flyway），仓库内不携带数据文件
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT_EXPOSE:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: yu-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}", "--appendonly", "true"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT_EXPOSE:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yu-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # V4.0 §7.3/C2：容器内默认跑 prod profile（关 Swagger/Druid 控制台、日志降噪）
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: yu-cjlujwc
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_USE_SSL: "false"
      DB_ALLOW_PUBLIC_KEY: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TOKEN_SECRET: ${TOKEN_SECRET:-}
      # 数据库版本管理（Flyway）默认关闭，避免影响现有本地库；新库首启可置 true
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
      # Druid 监控台/文档端点：prod profile 下基线关闭，仅按需显式放开
      DRUID_STAT_VIEW_ENABLED: ${DRUID_STAT_VIEW_ENABLED:-false}
      DRUID_LOGIN_USERNAME: ${DRUID_LOGIN_USERNAME:-}
      DRUID_LOGIN_PASSWORD: ${DRUID_LOGIN_PASSWORD:-}
      DOC_ENDPOINT_PERMIT_ALL: ${DOC_ENDPOINT_PERMIT_ALL:-false}
      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-false}
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-30}
      TZ: Asia/Shanghai
    volumes:
      - backend-logs:/app/logs
      - backend-upload:/app/uploadPath
    ports:
      - "${BACKEND_PORT_EXPOSE:-8080}:8080"
    # V4.0 §7.3/Q1：JVM 通过 UseContainerSupport 感知 cgroup 限额，堆内存按 MaxRAMPercentage 推导
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    cpus: ${BACKEND_CPU_LIMIT:-2.0}
    security_opt:
      - no-new-privileges:true
    # 健康探活沿用镜像内 HEALTHCHECK（bash /dev/tcp，不依赖 curl/wget），
    # frontend 通过 service_healthy 等待后端就绪

  frontend:
    build:
      context: ./yu-ui-vue3
      dockerfile: Dockerfile
    container_name: yu-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT_EXPOSE:-80}:80"
    security_opt:
      - no-new-privileges:true

  # V4.0 §7.3：门户端（师生服务）镜像补齐，与管理端共用同一后端，独立宿主端口
  portal:
    build:
      context: ./yu-portal-ui-vue3
      dockerfile: Dockerfile
      args:
        # 构建期烧入：门户内“管理入口”跳转的管理端地址（留空则不跳转）
        VITE_APP_ADMIN_URL: ${PORTAL_ADMIN_URL:-}
    container_name: yu-portal
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORTAL_PORT_EXPOSE:-81}:80"
    security_opt:
      - no-new-privileges:true

volumes:
  mysql-data:
  redis-data:
  backend-logs:
  backend-upload:
