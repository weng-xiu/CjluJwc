# CjluJwc 门户端（师生互动服务门户）Nginx 配置（容器内）
# 与管理端 yu-ui-vue3/nginx.conf 同口径：/prod-api/ 反代后端并去前缀（与 vite dev proxy 一致），
# history 路由回退 index.html；两端口共用同一后端，独立宿主端口暴露（见 docker-compose.yml）。
server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    client_max_body_size 100m;

    # 基础安全响应头（V4.0 §7.3：门户面向全校师生，默认加最小防护栈）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 不缓存：发版后师生端立即拿到新 chunk 指纹，避免白屏
    # 注：nginx add_header 为「层级覆盖」——location 内只要出现任一 add_header，就不再继承 server 级的，故需重列安全头
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 后端 API 反向代理：/prod-api/captchaImage -> http://backend:8080/captchaImage
    location /prod-api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 带内容哈希的静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 传输层压缩：构建产物不落地 .gz（见 vite.config.js 注释），由 nginx 现场压缩
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
