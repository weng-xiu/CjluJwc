# Q4 安全加固 · 依赖漏洞常态扫描（周度审计作业，与 Dependabot 互补）
# Dependabot 负责"自动开升级 PR"，本作业负责"产出可读的漏洞清单与依赖快照并留痕归档"，
# 两者共同满足 Q4 待补项：定期依赖漏洞扫描 + 漏洞清单可跟踪。
# 触发：每周一 02:00（Asia/Shanghai）定时 + 手动 dispatch；advisory（非阻塞），高危项由 Dependabot/人工跟进。
name: Security Scan

on:
  schedule:
    # GitHub 定时按 UTC；周日 18:00 UTC = 北京时间周一 02:00（与 Dependabot 周一节奏对齐）
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-audit:
    name: npm audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 仅活跃交付前端；原 Vue2 工程归档冻结不纳入常态扫描
        project: [yu-ui-vue3, yu-portal-ui-vue3]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: npm ci (from lock)
        working-directory: ${{ matrix.project }}
        run: npm ci

      # --omit=dev：只审计随生产镜像交付的依赖；audit-level=high 只列高危及以上
      # advisory：存量大版本可能命中历史公告，先不阻断，产出 JSON 供跟踪，收敛后转阻塞
      - name: npm audit (high+, advisory)
        working-directory: ${{ matrix.project }}
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Export audit report (JSON)
        working-directory: ${{ matrix.project }}
        if: always()
        run: npm audit --omit=dev --json > "../audit-${{ matrix.project }}.json" 2>/dev/null || true

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.project }}
          path: audit-${{ matrix.project }}.json
          retention-days: 30
          if-no-files-found: ignore

  backend-dependency-inventory:
    name: Maven 依赖清单快照
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 产出全模块依赖树，作为版本清单留痕归档；结合 Dependabot 广告库比对覆盖已知漏洞，
      # 如需 OSV/OWASP 深度 SCA 可后续接入（本作业不引入 NVD 外部依赖以保证常态可跑）。
      - name: Generate dependency tree
        run: mvn -B -q dependency:tree | tee backend-dependency-tree.txt

      - name: Upload dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-tree
          path: backend-dependency-tree.txt
          retention-days: 30
          if-no-files-found: ignore

  # -----------------------------------------------------------------------------
  # K5 供应链治理 · 标准 SBOM（CycloneDX）生成，作为可交付/可归档的软件物料清单。
  # 与上方"依赖树快照"的区别：树是排查视图，SBOM 是符合 CycloneDX 规范的机读物料清单，
  # 可作为等级保护/信创验收交付物并导入 VEX/SCA 平台。
  # 关键约束：SBOM 生成插件仅在联网 CI 解析，绝不写入 pom/reactor，本地离线构建（mvn -o）零影响；
  #          作业为 advisory（continue-on-error），插件不可用时不阻断常态扫描。
  # -----------------------------------------------------------------------------
  backend-sbom:
    name: Maven SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 全 reactor 聚合生成一份 CycloneDX BOM（输出到根 target/bom.xml 与 bom.json）
      - name: Generate aggregate CycloneDX SBOM
        continue-on-error: true
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom

      - name: Collect SBOM files
        if: always()
        run: |
          mkdir -p sbom-out
          [ -f target/bom.xml ] && cp target/bom.xml sbom-out/backend-sbom.xml || true
          [ -f target/bom.json ] && cp target/bom.json sbom-out/backend-sbom.json || true

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-backend-sbom
          path: sbom-out/
          retention-days: 90
          if-no-files-found: ignore

  frontend-sbom:
    name: npm SBOM (CycloneDX)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 仅活跃交付前端；Vue2 归档冻结不纳入
        project: [yu-ui-vue3, yu-portal-ui-vue3]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      # 直接基于 lockfile 生成 CycloneDX SBOM，无需 npm ci，更快且不受安装期脚本影响
      - name: Generate CycloneDX SBOM from lockfile
        working-directory: ${{ matrix.project }}
        continue-on-error: true
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.json -- package-lock.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-frontend-sbom-${{ matrix.project }}
          path: ${{ matrix.project }}/sbom.json
          retention-days: 90
          if-no-files-found: ignore
