# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            # 连接参数通过环境变量注入，未设置时沿用默认值（向后兼容当前开发机）
            master:
                url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:yu-CjluJwc}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=${DB_USE_SSL:true}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY:false}&serverTimezone=GMT%2B8
                username: ${DB_USER:root}
                password: ${DB_PASSWORD:root}
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: ${SLAVE_ENABLED:false}
                url: ${SLAVE_URL:}
                username: ${SLAVE_USER:}
                password: ${SLAVE_PASSWORD:}
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: ${druid.web-stat.enabled:true}
            statViewServlet:
                # V4.0 §7.3 止血：基线默认关闭（false），仅 application-dev.yml 显式开启；
                # 即使未正确指定 profile也不会把监控台暴露到公网
                enabled: ${druid.stat-view.enabled:false}
                # 设置白名单，不填则允许所有访问；生产建议收紧到运维网段
                allow: ${DRUID_ALLOW:}
                url-pattern: /druid/*
                # 控制台管理用户名和密码（Q4 安全加固 + V4.0 §7.3：不再内置 ruoyi/123456 弱口令；
                # 开发默认值取自 application-dev.yml 的 druid.console.*，生产由环境变量注入且默认关闭控制台）
                login-username: ${DRUID_LOGIN_USERNAME:${druid.console.username:}}
                login-password: ${DRUID_LOGIN_PASSWORD:${druid.console.password:}}
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        # V4.0 §7.3 止血：多语句执行默认关闭（dev profile 显式打开），阻断堆叠语句注入面
                        multi-statement-allow: ${druid.wall.multi-statement-allow:false}