# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置项目内ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  # 上传路径通过环境变量注入，未设置时沿用默认（Windows）。Linux 部署时设 RUIYI_PROFILE=/home/ruoyi/uploadPath
  profile: ${RUIYI_PROFILE:ruoyi/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
# 基线口径：默认 info（V4.0 §7.3 合规止血——生产不再默认 debug）；开发调试的 debug 由 application-dev.yml 覆盖
logging:
  level:
    com.yu: info
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 自动配置排除项（Flowable 7.1.0 重名前的 Spring Boot 2/3 自动配置类，在 SB4 下不存在，需要排除）
  autoconfigure:
    exclude:
      - org.flowable.spring.boot.eventregistry.EventRegistryAutoConfiguration
      - org.flowable.spring.boot.eventregistry.EventRegistryServicesAutoConfiguration
      - org.flowable.spring.boot.FlowableSecurityAutoConfiguration
      - org.flowable.spring.boot.actuate.info.FlowableInfoAutoConfiguration
      - org.flowable.spring.boot.rest.FlowableRestAutoConfiguration
      - org.flowable.spring.boot.rest.FlowableRestServletAutoConfiguration
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  # 数据库迁移引擎（V4.0 A6：基线化 35 个 phase 脚本）
  # 基线 enabled=false：存量库已人工到位，默认不自动改库；新环境建库或发布流程显式注入 FLYWAY_ENABLED=true
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    # 已有库首次接管：以 baseline 标记现存结构，不重跑历史脚本
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: existing yu-cjlujwc schema
    # 存量脚本为历史基线，允许先关校验和比对，避免小幅注释差异阻断启动
    validate-on-migrate: ${FLYWAY_VALIDATE:false}
    clean-disabled: true
    locations: ${FLYWAY_LOCATIONS:filesystem:db/migration}
  profiles:
    # V4.0 §7.3 多环境基线化：显式 profile 化，默认 dev（本地开发），容器/生产以 SPRING_PROFILES_ACTIVE=prod 启动。
    # druid（数据源配置）通过 profile group 绑定到各环境，保持既有 application-druid.yml 加载方式不变。
    active: ${SPRING_PROFILES_ACTIVE:dev}
    group:
      dev: druid
      prod: druid
      test: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置（通过环境变量注入，未设置时沿用默认 127.0.0.1:6379 无密码）
    redis:
      # 地址
      host: ${REDIS_HOST:127.0.0.1}
      # 端口，默认为6379
      port: ${REDIS_PORT:6379}
      # 数据库索引
      database: ${REDIS_DATABASE:0}
      # 密码
      password: ${REDIS_PASSWORD:}
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥（Q4 安全加固：改为环境变量注入，禁止明文入库；
  # 未设置时 TokenService 启动会生成一次性随机密钥并告警，生产/多实例务必设置 TOKEN_SECRET）
  secret: ${TOKEN_SECRET:}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.yu.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
# swagger 开关可被 profile 覆盖：application-prod.yml 设 swagger.ui-enabled=false 关闭接口文档
swagger:
  ui-enabled: ${SWAGGER_UI_ENABLED:true}
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${swagger.ui-enabled}
  swagger-ui:
    enabled: ${swagger.ui-enabled}
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.yu.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接（V4.0 §7.3 止血：由 3 个系统路径扩展到全部业务路径，消除业务写接口存储型 XSS 面）
  urlPatterns: /system/*,/monitor/*,/tool/*,/brm/*,/tpm/*,/sam/*,/aem/*,/portal/*,/oa/*,/dis/*

# 安全开关（V4.0 §7.3）：文档与监控类端点是否匿名放行。
# 基线默认 false（生产姿态）；仅 application-dev.yml 打开，避免 Swagger/Druid 控制台在生产 permitAll。
security:
  doc-endpoints:
    permit-all: ${DOC_ENDPOINT_PERMIT_ALL:false}

# 可观测性（V4.0 A5）：actuator 仅暴露 health/info，metrics 待接入 Prometheus 时再开
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: false

# Flowable 工作流引擎配置
flowable:
  # 启动时自动创建/升级 ACT_* 表（首次启动使用 true。若表不存在，需先手动建库后启动）
  database-schema-update: false
  # 开发阶段关闭异步任务执行器
  async-executor-activate: false
  # 开发阶段关闭历史数据异步处理
  async-history-executor-activate: false
  # 关闭不需要的模型子引擎，CMMN/DMN/App 引擎不需要，关闭后只保留流程引擎（BPMN）
  cmmn:
    enabled: false
  dmn:
    enabled: false
  idm:
    enabled: false
  content:
    enabled: false
  app:
    enabled: false
