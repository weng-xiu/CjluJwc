# 开发环境 profile（V4.0 §7.3 多环境基线化）
# 激活方式：默认即 dev（application.yml: spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}）
# 口径：只覆盖"环境差异化"开关，业务配置仍留在 application.yml / application-druid.yml，避免双份维护。
spring:
  # 热部署仅在开发环境启用
  devtools:
    restart:
      enabled: true

# 开发调试日志：SQL/业务明细可见（生产由 application-prod.yml 收敛为 warn）
logging:
  level:
    com.yu: debug
    org.springframework: warn

# 开发期放行文档与监控端点（Swagger / springdoc / Druid 控制台），便于本地联调
security:
  doc-endpoints:
    permit-all: true

swagger:
  ui-enabled: true

# Druid 监控台开发期开启；口令为 dev 专用默认值，可被 DRUID_LOGIN_USERNAME / DRUID_LOGIN_PASSWORD 覆盖
# （application-druid.yml 的 statViewServlet 登录项引用本处的 druid.console.*，生产 profile 已关闭控制台）
druid:
  console:
    username: ${DRUID_LOGIN_USERNAME:druid}
    password: ${DRUID_LOGIN_PASSWORD:Druid#Cjlu2026#Dev}
  stat-view:
    enabled: true
  wall:
    # 开发期允许一次执行多条语句（便于脚本调试）；生产关闭
    multi-statement-allow: true
